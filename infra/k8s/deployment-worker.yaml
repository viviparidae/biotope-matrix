apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythagora-bios-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pythagora-bios-worker
  template:
    metadata:
      labels:
        app: pythagora-bios-worker
    spec:
      containers:
        - name: worker
          image: pythagora-bios/worker:latest
