<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pythagora-bios | Phase 1 PoC</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      html, body { margin: 0; min-height: 100%; background: #0b1020; color: #dbeafe; }
      body { display: grid; place-items: center; overflow: auto; }
      main { position: relative; width: min(100vw, 960px); }
      canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; background: #111827; }
      .status { position: absolute; top: 10px; left: 12px; padding: 8px 10px; color: #d1d5db; background: #111827d9; border: 1px solid #334155; font-size: 12px; pointer-events: none; }
      .controls { position: absolute; top: 10px; right: 12px; width: 220px; padding: 12px; background: #111827ee; border: 1px solid #475569; box-shadow: 0 8px 24px #0006; }
      .controls h2 { margin: 0 0 10px; font-size: 13px; color: #f8fafc; }
      .control { display: grid; grid-template-columns: 1fr 68px; gap: 8px; align-items: center; margin: 8px 0; font-size: 11px; }
      .control input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #65d66f; }
      .control output { color: #93c5fd; text-align: right; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
      button { padding: 7px 5px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; font: inherit; font-size: 10px; cursor: pointer; }
      button:hover { background: #334155; }
      @media (max-width: 600px) { .controls { position: relative; top: auto; right: auto; width: auto; margin: 8px; } .status { top: 8px; left: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <canvas id="biotope" width="960" height="540" aria-label="極小ドットの生態系シミュレーション"></canvas>
      <div id="status" class="status" aria-live="polite"></div>
      <section id="controls" class="controls" aria-label="シミュレーション設定">
        <h2>チューニング</h2>
        <label class="control"><span>草スポーン間隔</span><output id="grass-interval-value"></output><input id="grass-interval" type="range" min="0.1" max="5" step="0.1" value="0.5"></label>
        <label class="control"><span>草の上限数</span><output id="grass-limit-value"></output><input id="grass-limit" type="range" min="10" max="300" step="10" value="180"></label>
        <label class="control"><span>草食の視野</span><output id="herbivore-sight-value"></output><input id="herbivore-sight" type="range" min="1" max="150" step="1" value="12"></label>
        <label class="control"><span>分裂エネルギー</span><output id="split-energy-value"></output><input id="split-energy" type="range" min="50" max="300" step="5" value="180"></label>
        <label class="control"><span>肉食の移動速度</span><output id="carnivore-speed-value"></output><input id="carnivore-speed" type="range" min="1" max="60" step="1" value="16"></label>
        <label class="control"><span>肉食のエネルギー消費</span><output id="carnivore-metabolism-value"></output><input id="carnivore-metabolism" type="range" min="0.1" max="10" step="0.1" value="1.8"></label>
        <div class="actions"><button id="reset">個体をクリア</button><button id="add-herbivores">ランダムに10体追加</button><button id="add-carnivore">肉食個体を1体追加</button><button id="audio-toggle">音響: OFF</button></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
