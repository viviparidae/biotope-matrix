name: fitness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Run unit and architecture tests
        run: |
          set +e
          mkdir -p .artifacts site/reports
          pnpm exec vitest run \
            src/architecture.fitness.test.ts \
            tests/unit/predation.test.ts \
            --reporter=json \
            --outputFile=.artifacts/fitness-report.json
          status=$?
          node scripts/generate-test-report.mjs \
            .artifacts/fitness-report.json \
            site/reports/fitness-test-report.html
          if [ -f site/reports/fitness-test-report.html ]; then
            echo "Fitness report: site/reports/fitness-test-report.html"
          fi
          exit $status

      - name: Run synthetic ecosystem transaction checks
        run: |
          mkdir -p .artifacts
          pnpm exec vitest run src/tests/syntheticTransaction.test.ts \
            --reporter=default \
            --reporter=json \
            --outputFile=.artifacts/synthetic-results.json

      - name: Validate ecological health metrics
        run: |
          cat > /tmp/validate-metrics.mjs <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          const path = '.artifacts/synthetic-results.json';
          if (!existsSync(path)) {
            console.error('Synthetic transaction metrics were not produced.');
            process.exit(1);
          }
          const data = JSON.parse(readFileSync(path, 'utf8'));
          if ((data.numFailedTests ?? 0) > 0 || (data.numFailedTestSuites ?? 0) > 0) {
            console.error('Synthetic ecosystem checks failed.');
            process.exit(1);
          }
          console.log('Synthetic ecosystem metrics validated:', JSON.stringify({
            passed: data.numPassedTests,
            failed: data.numFailedTests,
          }));
          EOF
          node /tmp/validate-metrics.mjs

      - name: Upload synthetic metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ecosystem-metrics
          path: .artifacts/

      - name: Upload fitness test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-test-report
          path: site/reports/fitness-test-report.html
          if-no-files-found: ignore
          retention-days: 7
