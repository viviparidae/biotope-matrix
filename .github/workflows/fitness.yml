name: fitness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run unit and architecture tests
        run: pnpm exec vitest run src/architecture.fitness.test.ts tests/unit/predation.test.ts

      - name: Run synthetic ecosystem transaction checks
        run: |
          mkdir -p .artifacts
          pnpm exec vitest run src/tests/syntheticTransaction.test.ts --reporter=json --outputFile=.artifacts/synthetic-results.json

      - name: Validate ecological health metrics
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = '.artifacts/synthetic-results.json';
          if (!fs.existsSync(path)) {
            console.error('Synthetic transaction metrics were not produced.');
            process.exit(1);
          }
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if ((data.numFailedTests ?? 0) > 0 || (data.numFailedTestSuites ?? 0) > 0) {
            console.error('Synthetic ecosystem checks failed.');
            process.exit(1);
          }
          console.log('Synthetic ecosystem metrics validated:', JSON.stringify({ passed: data.numPassedTests, failed: data.numFailedTests }));
          NODE

      - name: Upload synthetic metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ecosystem-metrics
          path: .artifacts/

      - name: Type check
        run: pnpm exec tsc --noEmit
