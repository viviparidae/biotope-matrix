name: Documentation Quality Gate

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'
      - 'scripts/**'
      - 'mkdocs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'
      - 'scripts/**'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  documentation-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install validation dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install pyyaml mkdocs-material
          pnpm add -Dw markdownlint-cli2 textlint @textlint/textlint-plugin-markdown textlint-rule-terminology

      - name: Validate requirement model
        run: python3 scripts/validate_requirements.py

      - name: Generate traceability graph
        run: python3 scripts/generate_traceability.py

      - name: Run markdown lint
        run: pnpm exec markdownlint-cli2 "docs/**/*.md" "README.md"

      - name: Run text lint
        run: pnpm exec textlint "docs/**/*.md" "README.md"

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Check document links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "docs/**/*.md" "README.md"
