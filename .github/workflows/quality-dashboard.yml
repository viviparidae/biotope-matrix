name: Deploy Quality Dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quality-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material pymdownx pyyaml

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Run unit tests with coverage
        if: always()
        run: |
          set +e
          mkdir -p .artifacts site/reports
          pnpm run test:unit:coverage \
            --reporter=json \
            --outputFile=.artifacts/unit-report.json
          echo "UNIT_EXIT=$?" >> "$GITHUB_ENV"

      - name: Run integration tests
        if: always()
        run: |
          set +e
          mkdir -p .artifacts
          pnpm exec vitest run tests/integration \
            --reporter=json \
            --outputFile=.artifacts/integration-report.json
          echo "INTEGRATION_EXIT=$?" >> "$GITHUB_ENV"

      - name: Generate test failure HTML reports
        if: always()
        run: |
          set +e
          mkdir -p site/reports
          node scripts/generate-test-report.mjs \
            .artifacts/unit-report.json \
            site/reports/unit-test-report.html || true
          node scripts/generate-test-report.mjs \
            .artifacts/integration-report.json \
            site/reports/integration-test-report.html || true

      - name: Generate quality metrics and dashboard markdown
        run: python3 scripts/generate_quality_report.py

      - name: Build MkDocs site
        run: mkdocs build -d site

      - name: Publish coverage and test reports into site
        if: always()
        run: |
          set +e
          mkdir -p site/reports/coverage
          # Vitest HTML coverage report
          if [ -d coverage ]; then
            cp -R coverage/. site/reports/coverage/
            echo "Coverage report copied to site/reports/coverage/"
          fi
          # Re-run report generation to ensure they are in place
          node scripts/generate-test-report.mjs \
            .artifacts/unit-report.json \
            site/reports/unit-test-report.html || true
          node scripts/generate-test-report.mjs \
            .artifacts/integration-report.json \
            site/reports/integration-test-report.html || true

      - name: Generate reports navigation page
        run: |
          COVERAGE_LINK=""
          UNIT_LINK=""
          INTEGRATION_LINK=""
          [ -f site/reports/coverage/index.html ] && COVERAGE_LINK='<li><a href="coverage/">📊 カバレッジレポート (HTML)</a></li>'
          [ -f site/reports/unit-test-report.html ] && UNIT_LINK='<li><a href="unit-test-report.html">🧪 ユニットテストレポート</a></li>'
          [ -f site/reports/integration-test-report.html ] && INTEGRATION_LINK='<li><a href="integration-test-report.html">🔗 統合テストレポート</a></li>'

          cat > site/reports/index.html <<HTML
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>CI Reports – Biotope Matrix</title>
              <style>
                :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
                body { margin: 0; padding: 0; background: #0f172a; color: #e2e8f0; }
                main { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
                h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
                .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
                         background: rgba(34,197,94,0.15); color: #22c55e;
                         font-size: 0.75rem; font-weight: 700; margin-left: 0.5rem; }
                ul { list-style: none; padding: 0; margin: 1.5rem 0; }
                li { margin: 0.75rem 0; }
                a { color: #60a5fa; text-decoration: none; font-size: 1.05rem; }
                a:hover { text-decoration: underline; }
                .back { margin-top: 2rem; border-top: 1px solid #334155; padding-top: 1rem; }
              </style>
            </head>
            <body>
              <main>
                <h1>CI Reports <span class="badge">GitHub Pages</span></h1>
                <p>最新 CI ビルドのテスト結果とカバレッジをブラウザで確認できます。</p>
                <ul>
                  ${COVERAGE_LINK}
                  ${UNIT_LINK}
                  ${INTEGRATION_LINK}
                </ul>
                <div class="back">
                  <a href="../">← ドキュメントトップへ戻る</a>
                </div>
              </main>
            </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
