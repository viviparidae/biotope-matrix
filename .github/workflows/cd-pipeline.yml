name: Continuous Delivery Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CI: true

jobs:
  commit-stage:
    name: Commit Stage (Lint, TypeCheck, Unit Tests, Build Once)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Static verification (TypeScript)
        run: pnpm exec tsc --noEmit

      - name: Fast unit test feedback
        run: pnpm run test:unit

      - name: Build artifact once
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          if-no-files-found: error
          retention-days: 1

  acceptance-stage:
    name: Acceptance Stage (BDD / Gherkin)
    needs: commit-stage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./site

      - name: Run acceptance tests
        run: |
          pnpm run test:acceptance
          pnpm run test:cucumber

  capacity-fitness-stage:
    name: Capacity & Fitness Stage (60fps, Synthetic Transactions)
    needs: acceptance-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run architecture fitness and synthetic ecosystem checks
        run: |
          pnpm exec vitest run src/architecture.fitness.test.ts src/tests/syntheticTransaction.test.ts
          pnpm run test:performance

      - name: Publish fitness report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  deploy-stage:
    name: Deployment Stage (GitHub Pages)
    needs: capacity-fitness-stage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
