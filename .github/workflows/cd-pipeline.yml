name: Continuous Delivery Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CI: true

jobs:
  commit-stage:
    name: Commit Stage (Lint, TypeCheck, Unit Tests, Build Once)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static verification (TypeScript)
        run: pnpm exec tsc --noEmit

      - name: Fast unit test feedback
        run: |
          set +e
          mkdir -p .artifacts
          pnpm exec vitest run tests/unit --reporter=json --outputFile=.artifacts/unit-report.json
          status=$?
          node scripts/generate-test-report.mjs .artifacts/unit-report.json site/reports/unit-test-report.html
          if [ -f site/reports/unit-test-report.html ]; then echo "Unit test report: site/reports/unit-test-report.html"; fi
          exit $status

      - name: Build artifact once
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload unit test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: site/reports/unit-test-report.html
          if-no-files-found: ignore
          retention-days: 7

  acceptance-stage:
    name: Acceptance Stage (BDD / Gherkin)
    needs: commit-stage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./site

      - name: Run acceptance tests
        run: |
          pnpm run test:acceptance
          pnpm run test:cucumber

  capacity-fitness-stage:
    name: Capacity & Fitness Stage (60fps, Synthetic Transactions)
    needs: acceptance-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture fitness and synthetic ecosystem checks
        run: |
          pnpm exec vitest run src/architecture.fitness.test.ts src/tests/syntheticTransaction.test.ts \
            --coverage.enabled \
            --coverage.reporter=html \
            --coverage.reporter=text-summary \
            --coverage.reporter=json-summary
          pnpm run test:performance

      - name: Publish fitness report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  deploy-stage:
    name: Deployment Stage (GitHub Pages)
    needs: capacity-fitness-stage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./app-dist

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: fitness-report
          path: ./report-dist

      - name: Download unit test report artifact
        uses: actions/download-artifact@v4
        with:
          name: unit-test-report
          path: ./unit-test-report-dist

      - name: Prepare GitHub Pages bundle
        run: |
          mkdir -p ./pages
          if [ -d ./app-dist ]; then cp -R ./app-dist/. ./pages/; fi
          mkdir -p ./pages/reports/coverage
          if [ -d ./report-dist/coverage ]; then cp -R ./report-dist/coverage/. ./pages/reports/coverage/; fi
          if [ -d ./unit-test-report-dist ]; then cp -R ./unit-test-report-dist/. ./pages/reports/; fi

          cat > ./pages/reports/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>CI Reports</title>
            </head>
            <body>
              <main style="font-family: sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem;">
                <h1>CI Reports</h1>
                <ul>
                  <li><a href="../">Application</a></li>
                  <li><a href="coverage/">Coverage Report</a></li>
                  <li><a href="unit-test-report.html">Unit Test Failure Report</a></li>
                </ul>
              </main>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
