name: Continuous Delivery Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CI: true

jobs:
  commit-stage:
    name: Commit Stage (TypeCheck, Unit Tests, Build Once)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static verification (TypeScript)
        run: pnpm run typecheck

      - name: Fast unit test feedback
        run: |
          set +e
          mkdir -p .artifacts site/reports
          pnpm exec vitest run tests/unit \
            --reporter=json \
            --outputFile=.artifacts/unit-report.json
          status=$?
          node scripts/generate-test-report.mjs \
            .artifacts/unit-report.json \
            site/reports/unit-test-report.html
          if [ -f site/reports/unit-test-report.html ]; then
            echo "Unit test report: site/reports/unit-test-report.html"
          fi
          exit $status

      - name: Build frontend artifact
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload unit test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: site/reports/unit-test-report.html
          if-no-files-found: ignore
          retention-days: 7

  acceptance-stage:
    name: Acceptance Stage (BDD / Gherkin)
    needs: commit-stage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./dist

      - name: Run acceptance tests
        run: pnpm run test:acceptance

      - name: Run Cucumber BDD tests
        run: pnpm run test:cucumber

  capacity-fitness-stage:
    name: Capacity & Fitness Stage (Architecture, Synthetic Ecosystem)
    needs: acceptance-stage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture fitness and unit+integration with coverage
        run: |
          set +e
          mkdir -p .artifacts site/reports
          pnpm exec vitest run \
            src/architecture.fitness.test.ts \
            tests/unit \
            tests/integration \
            --coverage \
            --coverage.reporter=html \
            --coverage.reporter=text-summary \
            --coverage.reporter=json-summary \
            --coverage.reportsDirectory=coverage \
            --reporter=json \
            --outputFile=.artifacts/fitness-report.json
          echo "FITNESS_EXIT=$?" >> "$GITHUB_ENV"

      - name: Generate fitness HTML report
        if: always()
        run: |
          node scripts/generate-test-report.mjs \
            .artifacts/fitness-report.json \
            site/reports/fitness-test-report.html || true

      - name: Run synthetic ecosystem transaction checks
        if: always()
        run: |
          set +e
          mkdir -p .artifacts
          pnpm exec vitest run src/tests/syntheticTransaction.test.ts \
            --reporter=default \
            --reporter=json \
            --outputFile=.artifacts/synthetic-results.json
          echo "SYNTHETIC_EXIT=$?" >> "$GITHUB_ENV"

      - name: Validate ecological health metrics
        if: always()
        run: |
          set +e
          cat > /tmp/validate-metrics.mjs <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          const path = '.artifacts/synthetic-results.json';
          if (!existsSync(path)) {
            console.warn('Synthetic transaction metrics were not produced.');
            process.exit(0);
          }
          const data = JSON.parse(readFileSync(path, 'utf8'));
          if ((data.numFailedTests ?? 0) > 0 || (data.numFailedTestSuites ?? 0) > 0) {
            console.warn('Synthetic ecosystem checks failed; logs included in reports.');
            process.exit(0);
          }
          console.log('Synthetic ecosystem metrics validated:', JSON.stringify({
            passed: data.numPassedTests, failed: data.numFailedTests
          }));
          EOF
          node /tmp/validate-metrics.mjs

      - name: Run performance tests
        if: always()
        run: |
          set +e
          pnpm run test:performance
          echo "PERF_EXIT=$?" >> "$GITHUB_ENV"

      - name: Publish fitness report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish synthetic metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ecosystem-metrics
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish fitness HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-test-report
          path: site/reports/fitness-test-report.html
          if-no-files-found: ignore
          retention-days: 7

  deploy-stage:
    name: Deployment Stage (GitHub Pages)
    needs: capacity-fitness-stage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material pyyaml

      - name: Download fitness coverage report
        uses: actions/download-artifact@v4
        with:
          name: fitness-coverage-report
          path: ./coverage
        continue-on-error: true

      - name: Download unit test report
        uses: actions/download-artifact@v4
        with:
          name: unit-test-report
          path: ./site/reports
        continue-on-error: true

      - name: Download fitness test report
        uses: actions/download-artifact@v4
        with:
          name: fitness-test-report
          path: ./site/reports
        continue-on-error: true

      - name: Generate quality metrics
        if: always()
        run: python3 scripts/generate_quality_report.py

      - name: Build MkDocs documentation site
        if: always()
        run: mkdocs build -d site || true

      - name: Integrate coverage and test reports into Pages bundle
        if: always()
        run: |
          mkdir -p site/reports/coverage

          # Vitest coverage HTML report
          if [ -d coverage ]; then
            cp -R coverage/. site/reports/coverage/
            echo "Coverage report integrated at site/reports/coverage/"
          fi

          # Reports navigation page
          COVERAGE_LINK=""
          UNIT_LINK=""
          FITNESS_LINK=""
          [ -f site/reports/coverage/index.html ] && \
            COVERAGE_LINK='<li><a href="coverage/">📊 カバレッジレポート (HTML)</a></li>'
          [ -f site/reports/unit-test-report.html ] && \
            UNIT_LINK='<li><a href="unit-test-report.html">🧪 ユニットテストレポート</a></li>'
          [ -f site/reports/fitness-test-report.html ] && \
            FITNESS_LINK='<li><a href="fitness-test-report.html">⚡ フィットネス・アーキテクチャテストレポート</a></li>'

          cat > site/reports/index.html <<HTML
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>CI Reports – Biotope Matrix</title>
              <style>
                :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
                body { margin: 0; background: #0f172a; color: #e2e8f0; }
                main { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
                h1 { font-size: 1.75rem; }
                .badge { padding: 0.2rem 0.6rem; border-radius: 999px;
                         background: rgba(34,197,94,0.15); color: #22c55e;
                         font-size: 0.75rem; font-weight: 700; margin-left: 0.5rem; }
                ul { list-style: none; padding: 0; margin: 1.5rem 0; }
                li { margin: 0.75rem 0; }
                a { color: #60a5fa; text-decoration: none; font-size: 1.05rem; }
                a:hover { text-decoration: underline; }
                .back { margin-top: 2rem; border-top: 1px solid #334155; padding-top: 1rem; }
              </style>
            </head>
            <body>
              <main>
                <h1>CI Reports <span class="badge">GitHub Pages</span></h1>
                <p>最新 CI ビルドのテスト結果とカバレッジをブラウザで確認できます。</p>
                <ul>
                  ${COVERAGE_LINK}
                  ${UNIT_LINK}
                  ${FITNESS_LINK}
                </ul>
                <div class="back"><a href="../">← ドキュメントトップへ戻る</a></div>
              </main>
            </body>
          </html>
          HTML
          echo "Reports index generated."

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
