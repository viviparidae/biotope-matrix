<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Report</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --muted: #94a3b8;
        --border: #334155;
        --pass: #22c55e;
        --fail: #ef4444;
        --text: #e2e8f0;
        --code: #f8fafc;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        margin: 2rem 0;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
      }
      .label {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .value {
        font-size: 2rem;
        font-weight: 700;
        margin-top: 0.5rem;
      }
      .status {
        display: inline-block;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        font-weight: 700;
        margin-top: 1rem;
      }
      .status-pass {
        background: rgba(34, 197, 94, 0.16);
        color: var(--pass);
      }
      .status-fail {
        background: rgba(239, 68, 68, 0.18);
        color: var(--fail);
      }
      .failure-item {
        margin-top: 1.25rem;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
      }
      .failure-item h3 {
        margin-top: 0;
        color: #fbbf24;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #020617;
        color: var(--code);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        overflow-x: auto;
      }
      .empty {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Test execution report</h1>
      <div class="status status-pass">PASS</div>

      <section class="summary">
        <div class="card">
          <div class="label">Passed tests</div>
          <div class="value">24</div>
        </div>
        <div class="card">
          <div class="label">Failed tests</div>
          <div class="value">0</div>
        </div>
        <div class="card">
          <div class="label">Test suites</div>
          <div class="value">12</div>
        </div>
        <div class="card">
          <div class="label">Failed suites</div>
          <div class="value">0</div>
        </div>
      </section>

      <section>
        <h2>Failures</h2>
        <p class="empty">No failed assertions were captured.</p>
      </section>
    </main>
  </body>
</html>
